<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QRBridge 发送端 v3 — 自动翻页</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--blue:#2f6fe4;--blue-d:#1e57bd;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--bg:#f1f5f9}
  body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden}
  .app{display:flex;height:100vh}
  /* 左侧设置 */
  .side{width:360px;flex:0 0 360px;background:#fff;border-right:1px solid var(--line);padding:18px;overflow-y:auto}
  .side h1{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
  .side h1 b{color:var(--blue)}
  .ver{font-size:11px;color:#94a3b8;font-weight:400;margin-left:auto}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
  .card h3{font-size:13px;font-weight:700;color:#334155;margin-bottom:10px}
  #fileInput{display:block;width:100%;font-size:12px;padding:8px;border:1.5px dashed #93b4f5;border-radius:10px;background:#f5f9ff;cursor:pointer}
  .drop{border:1.5px dashed #93b4f5;border-radius:10px;background:#f5f9ff;padding:18px 10px;text-align:center;font-size:12px;color:var(--mute);cursor:pointer;transition:.15s}
  .drop.over{background:#e8f1ff;border-color:var(--blue)}
  .meta{display:none;margin-top:10px;font-size:12px;line-height:1.8;color:#334155;background:#f8fafc;border-radius:8px;padding:8px 10px;word-break:break-all}
  .meta b{color:#0f172a}
  .row{display:flex;align-items:center;gap:12px;margin:6px 0}
  .row .val{min-width:92px;text-align:center;font-weight:700;color:var(--blue);font-size:13px;background:#eef4ff;border-radius:20px;padding:4px 10px}
  input[type=range]{flex:1;-webkit-appearance:none;height:5px;border-radius:3px;background:#e2e8f0;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--blue);cursor:pointer}
  .hint{font-size:11px;color:#94a3b8;line-height:1.6;margin-top:6px}
  .btns{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;border:none;border-radius:10px;padding:12px 10px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
  .btn.primary{background:var(--blue);color:#fff}
  .btn.primary:hover{background:var(--blue-d)}
  .btn.ghost{background:#eef2f7;color:#475569}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .status{margin-top:14px;font-size:12px;padding:10px;border-radius:8px;background:#eef4ff;color:#1e40af;text-align:center;line-height:1.5}
  .status.err{background:#fef2f2;color:#b91c1c}
  /* 右侧舞台 */
  .stage-wrap{flex:1;display:flex;flex-direction:column;padding:20px;min-width:0;overflow:hidden}
  .qr-card{flex:1;background:#fff;border-radius:20px;box-shadow:0 8px 30px rgba(15,23,42,.08);display:flex;flex-direction:column;padding:16px;min-height:0}
  .qr-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;background:#fff;border-radius:12px}
  .qr-stage img{display:block;image-rendering:pixelated}
  .placeholder{color:#94a3b8;font-size:14px;text-align:center;line-height:1.9;padding:40px}
  .badge{display:flex;justify-content:center;align-items:baseline;gap:8px;margin-top:8px}
  .badge .n{font-size:30px;font-weight:800;color:var(--blue);letter-spacing:-.5px}
  .badge .t{font-size:15px;color:var(--mute);font-weight:600}
  .sub{text-align:center;font-size:12px;color:#94a3b8;margin-top:2px;font-family:ui-monospace,Consolas,monospace;word-break:break-all}
  .nav{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:10px}
  .nav-btn{width:46px;height:46px;border-radius:50%;border:none;background:var(--blue);color:#fff;font-size:20px;font-weight:700;cursor:pointer}
  .nav-btn:disabled{background:#cbd5e1;cursor:not-allowed}
  .auto{display:flex;align-items:center;gap:8px;font-size:12px;color:#475569;background:#f1f5f9;border-radius:22px;padding:6px 12px}
  .auto select{border:none;background:transparent;font-size:12px;font-weight:700;color:var(--blue);outline:none;cursor:pointer}
  .auto input{width:15px;height:15px;accent-color:var(--blue);cursor:pointer}
  .prog{height:5px;border-radius:3px;background:#e2e8f0;overflow:hidden;margin-top:12px}
  .prog i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
  .countbar{height:3px;border-radius:2px;background:#eef2f7;overflow:hidden;margin-top:8px}
  .countbar i{display:block;height:100%;width:0;background:#94a3b8}
  .tip{font-size:11px;color:#94a3b8;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h1>QRBridge 发送端 <b>v3</b><span class="ver">自动翻页版</span></h1>

    <div class="card">
      <h3>1. 选择文件</h3>
      <div class="drop" id="drop">点击选择，或把文件拖到这里</div>
      <input type="file" id="fileInput" style="display:none">
      <div class="meta" id="meta"></div>
    </div>

    <div class="card">
      <h3>2. 每片字节数</h3>
      <div class="row">
        <input type="range" id="chunkSlider" min="300" max="1500" step="50" value="400">
        <div class="val" id="chunkVal">400 B</div>
      </div>
      <div class="hint">越小＝二维码越稀、越好扫，但片数变多；推荐 400。</div>
    </div>

    <div class="card">
      <h3>3. 翻页</h3>
      <div class="row" style="justify-content:space-between">
        <label class="auto"><input type="checkbox" id="autoChk" checked>自动翻页</label>
        <label class="auto">每张
          <select id="autoRate">
            <option value="2000">2 秒</option>
            <option value="3000" selected>3 秒</option>
            <option value="5000">5 秒</option>
            <option value="8000">8 秒</option>
          </select>
        </label>
      </div>
      <div class="row" style="justify-content:space-between">
        <label class="auto"><input type="checkbox" id="loopChk" checked>循环播放</label>
        <span class="hint" style="margin:0">← → 键 · 滚轮 也能翻</span>
      </div>
    </div>

    <div class="btns">
      <button class="btn primary" id="startBtn">生成二维码</button>
      <button class="btn ghost" id="resetBtn">重置</button>
    </div>
    <div class="status" id="status">请选择一个文件</div>
  </aside>

  <main class="stage-wrap">
    <div class="qr-card">
      <div class="qr-stage" id="stage">
        <div class="placeholder">选择文件后点「生成二维码」<br>二维码会按节奏自动翻页</div>
      </div>
      <div class="badge"><span class="n" id="badgeN">—</span><span class="t" id="badgeT"></span></div>
      <div class="sub" id="sub">等待生成</div>
      <div class="prog"><i id="progBar"></i></div>
      <div class="nav">
        <button class="nav-btn" id="prevBtn" disabled>◀</button>
        <button class="nav-btn" id="nextBtn" disabled>▶</button>
      </div>
      <div class="countbar"><i id="countBar"></i></div>
      <div class="tip" id="tip">提示：接收端「已收 N/M」涨不上去时，看这里的片号与 i 值是否跟着变。</div>
    </div>
  </main>
</div>

<script>
/* ===== Base45 (RFC 9285)，与原版完全一致 ===== */
(function(g){
  var A='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:';
  g.base45={encode:function(input){
    if(typeof input==='string') input=new TextEncoder().encode(input);
    var r=[],i=0;
    while(i<input.length){
      if(i+1<input.length){var v=input[i]+(input[i+1]<<8);r.push(A[v%45],A[Math.floor(v/45)%45],A[Math.floor(v/2025)]);i+=2;}
      else{var w=input[i];r.push(A[w%45],A[Math.floor(w/45)]);i+=1;}
    }
    return r.join('');
  }};
})(window);

/* ===== 状态 ===== */
var ST={
  name:'',size:0,fp:'',chunks:[],fnChunk:null,total:0,idx:0,
  auto:true,rate:3000,loop:true,timer:null,deadline:0,cache:new Map(),round:1,built:false
};
var $=function(id){return document.getElementById(id)};
var stage=$('stage'),badgeN=$('badgeN'),badgeT=$('badgeT'),subEl=$('sub'),
    progBar=$('progBar'),countBar=$('countBar'),tipEl=$('tip'),
    prevBtn=$('prevBtn'),nextBtn=$('nextBtn');

function setStatus(msg,err){var s=$('status');s.textContent=msg;s.className='status'+(err?' err':'');}
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(2)+' MB';}

/* 5 位文件指纹（与原版同算法） */
function genFp(){
  var t=Date.now(),r=Math.floor(Math.random()*46656);
  return ((t%60466176)*1000+r).toString(36).padStart(5,'0').slice(-5);
}
/* CRC32 → 5 位 base36（与原版同算法，接收端按此校验） */
function crc5(data){
  if(pako.crc32) return pako.crc32(data).toString(36).padStart(5,'0').slice(-5);
  var T=new Uint32Array(256),i,j,c;
  for(i=0;i<256;i++){c=i;for(j=0;j<8;j++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);T[i]=c;}
  var crc=0xFFFFFFFF;
  for(i=0;i<data.length;i++)crc=(crc>>>8)^T[(crc^data.charCodeAt(i))&0xFF];
  return (((crc^0xFFFFFFFF)>>>0)).toString(36).padStart(5,'0').slice(-5);
}

/* ===== 二维码渲染 =====
   拿库算出的模块矩阵，自己按「整数像素/模块」直接画 canvas。
   画布像素 = 显示像素，1:1 映射，绝不会有半像素/缩放导致的模块粘连。   */
var canvasEl=null;
function getModel(text){
  var hit=ST.cache.get(text);
  if(hit) return hit;
  if(ST.cache.size>260) ST.cache.clear();
  var holder=document.createElement('div');
  holder.style.cssText='position:absolute;left:-99999px;top:0;';
  document.body.appendChild(holder);
  var model=null;
  try{
    var inst=new QRCode(holder,{text:text,width:256,height:256,correctLevel:QRCode.CorrectLevel.L,colorDark:'#000000',colorLight:'#ffffff'});
    model=inst&&inst._oQRCode;
  }catch(e){ document.body.removeChild(holder); throw e; }
  var n=0;
  try{ n=model.getModuleCount(); }catch(e){ n=0; }
  var ok=(n>0 && typeof model.isDark==='function');
  var fb=null;
  if(!ok){ var c=holder.querySelector('canvas'); if(c){ fb=c.toDataURL('image/png'); } }
  document.body.removeChild(holder);
  var o={model:ok?model:null,n:n,fallback:fb};
  ST.cache.set(text,o);
  return o;
}

function paint(){
  var item=ST.chunks[ST.idx];
  if(!item) return;
  var text=JSON.stringify(item.payload), q;
  try{ q=getModel(text); }catch(e){ setStatus('渲染失败：'+e.message,true); return; }

  var quiet=4, availW=Math.max(120,stage.clientWidth-6), availH=Math.max(120,stage.clientHeight-6);
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var sideCss=Math.min(availW,availH);

  if(q.model){
    var totalMod=q.n+quiet*2;
    var s=Math.max(1,Math.round(sideCss*dpr/totalMod));   // 每模块整数像素
    var px=totalMod*s;
    if(!canvasEl){
      stage.innerHTML='';
      canvasEl=document.createElement('canvas');
      canvasEl.style.display='block';
      stage.appendChild(canvasEl);
    }
    canvasEl.width=px; canvasEl.height=px;
    var ctx=canvasEl.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,px,px);
    ctx.fillStyle='#000';
    var m=q.model, row, col, x;
    for(row=0;row<q.n;row++){
      var y=(row+quiet)*s;
      for(col=0;col<q.n;col++) if(m.isDark(row,col)){
        ctx.fillRect((col+quiet)*s,y,s,s);
      }
    }
    canvasEl.style.width=(px/dpr)+'px';
    canvasEl.style.height=(px/dpr)+'px';
  }else if(q.fallback){
    if(!canvasEl){
      stage.innerHTML='';
      var im=document.createElement('img'); im.style.display='block';
      stage.appendChild(im); canvasEl=im;
    }
    canvasEl.src=q.fallback;
    canvasEl.style.maxWidth='100%'; canvasEl.style.maxHeight='100%';
  }else{
    stage.innerHTML='<div class="placeholder">二维码渲染失败</div>'; canvasEl=null;
  }
  updateText();
}

function updateText(){
  var item=ST.chunks[ST.idx];
  if(!item){ return; }
  var isFn=item.kind==='fn';
  badgeN.textContent=isFn?('第 '+ST.total+' / '+ST.total+' 张'):('第 '+(ST.idx+1)+' / '+ST.total+' 张');
  badgeT.textContent=isFn?'（文件名片）':'';
  var p=item.payload;
  var info=isFn
    ? 't=fn · 文件名片 · 收到它之后接收端才会落盘'
    : ('i='+p.i+'  t='+p.t+'  len='+p.d.length+'  crc='+p.h);
  subEl.textContent=info+' · 指纹 '+ST.fp+ (ST.loop? ' · 第 '+ST.round+' 轮':'');
  var done=ST.idx+1, pct=Math.round(done/ST.total*100);
  progBar.style.width=pct+'%';
  prevBtn.disabled=ST.idx<=0;
  nextBtn.disabled=ST.idx>=ST.total-1;
  tipEl.textContent='提示：接收端「已收 N/M」涨不上去时，看这里的 i 值是否也在变；不变说明还停在第 '+(isFn?ST.total:(ST.idx+1))+' 张。';
}

/* ===== 翻页与自动播放 ===== */
function goTo(i,keepTimer){
  if(!ST.total) return;
  if(i<0) i=0; if(i>ST.total-1) i=ST.total-1;
  ST.idx=i; paint();
  if(ST.auto && !keepTimer) startTimer();
}
function stopTimer(){ if(ST.timer){clearTimeout(ST.timer);ST.timer=null;} ST.deadline=0; countBar.style.width='0%'; }
function startTimer(){
  stopTimer();
  if(!ST.auto || !ST.built || ST.total<=1) return;
  ST.deadline=Date.now()+ST.rate;
  ST.timer=setTimeout(function(){
    if(ST.idx<ST.total-1){ goTo(ST.idx+1); }
    else if(ST.loop){ ST.round++; goTo(0); }
    else { ST.auto=false; $('autoChk').checked=false; stopTimer(); setStatus('已到最后一张，自动翻页已停'); }
  },ST.rate);
}
function tickBar(){
  if(ST.deadline && ST.auto){
    var left=ST.deadline-Date.now(); var pct=100-Math.max(0,left)/ST.rate*100;
    countBar.style.width=Math.min(100,Math.max(0,pct))+'%';
  }
  requestAnimationFrame(tickBar);
}
requestAnimationFrame(tickBar);

/* ===== 生成 ===== */
function buildAll(buf){
  var bytes=new Uint8Array(buf);
  var compressed=new Uint8Array(pako.deflate(bytes,{level:9}));
  var CH=parseInt($('chunkSlider').value,10);
  var totalData=Math.max(1,Math.ceil(compressed.length/CH));
  var list=[];
  for(var i=0;i<totalData;i++){
    var part=compressed.slice(i*CH,Math.min((i+1)*CH,compressed.length));
    var b45=base45.encode(part);
    list.push({kind:'data',payload:{i:i,t:totalData,h:crc5(b45),f:ST.fp,d:b45}});
  }
  var encN=btoa(String.fromCharCode.apply(null,new TextEncoder().encode(ST.name)));
  var fn={t:'fn',f:ST.fp,n:encN,s:ST.size,ts:Date.now(),tc:totalData};
  fn.h=crc5(JSON.stringify({t:fn.t,f:fn.f,n:fn.n,s:fn.s,ts:fn.ts,tc:fn.tc}));
  list.push({kind:'fn',payload:fn});
  ST.chunks=list; ST.total=list.length; ST.fp=ST.fp;
  ST.idx=0; ST.round=1; ST.cache.clear();
  ST.built=true;
}

async function generate(file){
  try{
    setStatus('正在读取文件…');
    var buf=await file.arrayBuffer();
    ST.name=file.name; ST.size=file.size; ST.fp=genFp();
    $('meta').style.display='block';
    $('meta').innerHTML='<b>'+file.name+'</b><br>大小：'+fmtSize(file.size)+'<br>指纹：<b>'+ST.fp+'</b>';
    setStatus('正在压缩分片…');
    await new Promise(function(r){setTimeout(r,10)});
    buildAll(buf);
    setStatus('已生成 '+ST.total+' 张（数据 '+ST.chunks.filter(function(x){return x.kind==='data'}).length+' + 名片 1）');
    goTo(0);
    startTimer();
  }catch(e){
    console.error(e);
    setStatus('生成失败：'+e.message,true);
  }
}

/* ===== 事件 ===== */
var chosen=null;
$('drop').addEventListener('click',function(){$('fileInput').click();});
$('drop').addEventListener('dragover',function(e){e.preventDefault();this.classList.add('over');});
$('drop').addEventListener('dragleave',function(){this.classList.remove('over');});
$('drop').addEventListener('drop',function(e){
  e.preventDefault(); this.classList.remove('over');
  if(e.dataTransfer.files[0]){ chosen=e.dataTransfer.files[0]; this.textContent='已选择：'+chosen.name; }
});
$('fileInput').addEventListener('change',function(e){
  chosen=e.target.files[0];
  if(chosen) $('drop').textContent='已选择：'+chosen.name;
});
$('startBtn').addEventListener('click',function(){
  if(!chosen){ setStatus('请先选择文件',true); return; }
  var b=this; b.disabled=true; b.textContent='生成中…';
  generate(chosen).finally(function(){ b.disabled=false; b.textContent='生成二维码'; });
});
$('resetBtn').addEventListener('click',function(){
  stopTimer();
  ST.chunks=[];ST.total=0;ST.built=false;ST.idx=0;ST.cache.clear();
  stage.innerHTML='<div class="placeholder">选择文件后点「生成二维码」<br>二维码会按节奏自动翻页</div>'; canvasEl=null;
  badgeN.textContent='—';badgeT.textContent='';subEl.textContent='等待生成';
  progBar.style.width='0%';prevBtn.disabled=true;nextBtn.disabled=true;
  chosen=null;$('fileInput').value='';$('drop').textContent='点击选择，或把文件拖到这里';
  $('meta').style.display='none';setStatus('请选择一个文件');
});
$('chunkSlider').addEventListener('input',function(){
  $('chunkVal').textContent=this.value+' B';
});
$('autoChk').addEventListener('change',function(){
  ST.auto=this.checked;
  if(ST.auto) startTimer(); else { stopTimer(); setStatus('自动翻页已关闭'); }
});
$('autoRate').addEventListener('change',function(){
  ST.rate=parseInt(this.value,10);
  if(ST.auto) startTimer();
});
$('loopChk').addEventListener('change',function(){ ST.loop=this.checked; });
prevBtn.addEventListener('click',function(){ ST.auto=false; $('autoChk').checked=false; stopTimer(); goTo(ST.idx-1); });
nextBtn.addEventListener('click',function(){ ST.auto=false; $('autoChk').checked=false; stopTimer(); goTo(ST.idx+1); });
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); ST.auto=false;$('autoChk').checked=false;stopTimer();goTo(ST.idx+1); }
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); ST.auto=false;$('autoChk').checked=false;stopTimer();goTo(ST.idx-1); }
  else if(e.key===' '){ e.preventDefault(); $('autoChk').checked=!$('autoChk').checked; $('autoChk').dispatchEvent(new Event('change')); }
});
stage.addEventListener('wheel',function(e){
  e.preventDefault();
  if(!ST.built) return;
  ST.auto=false;$('autoChk').checked=false;stopTimer();
  goTo(ST.idx+(e.deltaY>0?1:-1));
},{passive:false});
var rt=null;
